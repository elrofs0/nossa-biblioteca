<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f1a17">
<meta name="robots" content="noindex,nofollow">
<title>Nossa Biblioteca</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root{--bg:#1f1a17;--card:#2b2420;--ink:#f3ece4;--mute:#b5a99c;--acc:#e0a458;--line:#3d342e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
#login form{width:100%;max-width:340px;background:var(--card);padding:28px;border-radius:14px;border:1px solid var(--line)}
#login h1{margin:0 0 4px;font-size:1.7rem}
#login p{margin:0 0 20px;color:var(--mute);font-size:.95rem}
#login input{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
#login button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--acc);color:#1f1a17;font-weight:bold;cursor:pointer}
#erro{color:#ff8a7a;min-height:1.2em;font-size:.9rem;margin-top:10px}
/* app */
header{position:sticky;top:0;z-index:5;background:rgba(31,26,23,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 14px 10px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.top h1{margin:0;font-size:1.25rem}
.top small{color:var(--mute)}
#sair{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--mute);cursor:pointer}
.ctl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#busca{flex:1 1 220px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
select{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
#letras{display:flex;gap:4px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
#letras button{flex:0 0 auto;min-width:30px;padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer;font-family:system-ui,sans-serif;font-size:.85rem}
#letras button.on{background:var(--acc);color:#1f1a17;border-color:var(--acc)}
#info{color:var(--mute);font-size:.9rem;padding:10px 14px 0}
#grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;padding:14px}
.livro{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
.capa{aspect-ratio:2/3;width:100%;object-fit:cover;background:#3a302a;display:block}
.capa.gerada{display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font-size:.9rem;line-height:1.25;color:#fff}
.meta{padding:8px 9px 10px}
.t{font-size:.88rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.a{font-size:.78rem;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;margin-top:6px;font-family:system-ui,sans-serif;font-size:.68rem;padding:2px 6px;border-radius:4px;background:var(--line);color:var(--acc)}
#mais{display:block;margin:0 auto 40px;padding:12px 22px;border-radius:10px;border:1px solid var(--acc);background:none;color:var(--acc);cursor:pointer}
/* detalhe */
#det{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#det .box{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px;display:flex;gap:16px;max-height:90vh;overflow:auto}
@media(min-width:600px){#det{align-items:center}#det .box{border-radius:16px}}
#det img,#det .capa{width:120px;flex:0 0 120px;border-radius:8px}
#det h2{margin:0 0 6px;font-size:1.2rem}
#det p{margin:4px 0;color:var(--mute);font-size:.9rem}
#det a.btn{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:10px;background:var(--acc);color:#1f1a17;text-decoration:none;font-weight:bold}
#det .fechar{margin-top:10px;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>
<body>

<section id="login">
  <form id="f">
    <h1>📚 Nossa Biblioteca</h1>
    <p>Acervo particular. Entre com seu usuário.</p>
    <input id="u" autocomplete="username" placeholder="Usuário" required autocapitalize="none">
    <input id="s" type="password" autocomplete="current-password" placeholder="Senha" required>
    <button>Entrar</button>
    <div id="erro"></div>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <div class="top">
      <div><h1>📚 Nossa Biblioteca</h1><small id="ola"></small></div>
      <button id="sair">Sair</button>
    </div>
    <div class="ctl">
      <input id="busca" type="search" placeholder="Buscar por título ou autor…">
      <select id="tipo"><option value="">Todos os tipos</option></select>
      <select id="ordem">
        <option value="titulo">A–Z por título</option>
        <option value="autor">A–Z por autor</option>
        <option value="recentes">Mais recentes no canal</option>
      </select>
    </div>
    <div id="letras"></div>
  </header>
  <div id="info"></div>
  <div id="grade"></div>
  <button id="mais" class="hidden">Mostrar mais</button>
</section>

<div id="det" class="hidden"></div>

<script>
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let LIVROS = [], CANAL = null, filtrados = [], mostrados = 0, letra = '';
const PAG = 60;

async function chaveDoUsuario(user, senha, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(user.toLowerCase()+':'+senha), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function abrir(user, senha) {
  const [usuarios, cofre] = await Promise.all([
    fetch('usuarios.json',{cache:'no-cache'}).then(r=>r.json()),
    fetch('acervo.bin',{cache:'no-cache'}).then(r=>r.json())
  ]);
  const u = usuarios[user.trim().toLowerCase()];
  if (!u) throw new Error('Usuário ou senha incorretos.');
  let master;
  try {
    const k = await chaveDoUsuario(user.trim(), senha, b64(u.salt));
    master = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(u.iv)}, k, b64(u.chave));
  } catch(e) { throw new Error('Usuário ou senha incorretos.'); }
  const mk = await crypto.subtle.importKey('raw', master, 'AES-GCM', false, ['decrypt']);
  const dados = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(cofre.iv)}, mk, b64(cofre.dados));
  return {nome: u.nome, master: btoa(String.fromCharCode(...new Uint8Array(master))), dados: JSON.parse(dec.decode(dados))};
}
async function abrirComMaster(masterB64) {
  const cofre = await fetch('acervo.bin',{cache:'no-cache'}).then(r=>r.json());
  const mk = await crypto.subtle.importKey('raw', b64(masterB64), 'AES-GCM', false, ['decrypt']);
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(cofre.iv)}, mk, b64(cofre.dados))));
}

function iniciar(nome, dados) {
  CANAL = dados.canal; LIVROS = dados.livros;
  LIVROS.forEach(l => l._b = norm(l.titulo+' '+(l.autor||'')));
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#ola').textContent = `Olá, ${nome} · ${LIVROS.length.toLocaleString('pt-BR')} livros`;
  const tipos = [...new Set(LIVROS.map(l=>l.tipo).filter(Boolean))].sort();
  $('#tipo').innerHTML = '<option value="">Todos os tipos</option>' + tipos.map(t=>`<option>${t}</option>`).join('');
  $('#letras').innerHTML = ['Todas', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ', '#'].map(x=>`<button data-l="${x==='Todas'?'':x}">${x}</button>`).join('');
  $('#letras').firstChild.classList.add('on');
  filtrar();
}

function chaveOrdem(l, campo){ return norm(campo==='autor' ? (l.autor||'~') : l.titulo).replace(/^(o|a|os|as|the|um|uma)\s+/,''); }
function filtrar() {
  const q = norm($('#busca').value).split(/\s+/).filter(Boolean);
  const tipo = $('#tipo').value, ordem = $('#ordem').value;
  filtrados = LIVROS.filter(l => (!tipo || l.tipo===tipo) && q.every(p => l._b.includes(p)) &&
    (!letra || (()=>{ const c = chaveOrdem(l, ordem==='autor'?'autor':'titulo')[0]||'#'; return letra==='#' ? !/[a-z]/.test(c) : c===letra.toLowerCase(); })()));
  if (ordem==='recentes') filtrados.sort((a,b)=>b.id-a.id);
  else filtrados.sort((a,b)=>chaveOrdem(a,ordem).localeCompare(chaveOrdem(b,ordem),'pt'));
  $('#info').textContent = filtrados.length ? `${filtrados.length.toLocaleString('pt-BR')} livro(s)` : 'Nenhum livro encontrado.';
  $('#grade').innerHTML = ''; mostrados = 0; mostrarMais();
}
function corDe(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 35% 32%)`; }
function capaGerada(l){ return `<div class="capa gerada" style="background:${corDe(l.titulo)}">${esc(l.titulo)}</div>`; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mostrarMais() {
  const frag = document.createDocumentFragment();
  filtrados.slice(mostrados, mostrados+PAG).forEach(l => {
    const b = document.createElement('button'); b.className='livro';
    b.innerHTML = `${capaGerada(l)}<div class="meta"><div class="t">${esc(l.titulo)}</div>${l.autor?`<div class="a">${esc(l.autor)}</div>`:''}${l.tipo?`<span class="tag">${esc(l.tipo)}</span>`:''}</div>`;
    b.onclick = () => detalhe(l);
    frag.appendChild(b); observador.observe(b); b._l = l;
  });
  $('#grade').appendChild(frag);
  mostrados += PAG;
  $('#mais').classList.toggle('hidden', mostrados >= filtrados.length);
}

/* ---- capas reais (Open Library → Google Books), com cache no aparelho ---- */
const CACHE_KEY = 'nb-capas-v2';
let capas = {}; try { capas = JSON.parse(localStorage.getItem(CACHE_KEY)||'{}'); } catch(e){}
const salvarCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(capas)); } catch(e){} };
const fila = []; let ativos = 0;
async function buscarCapa(l) {
  if (l.capa) return l.capa;
  const k = String(l.id);
  if (k in capas) return capas[k];
  const termo = l.titulo.replace(/\(.*?\)|\[.*?\]/g,'').trim();
  let url = '';
  try {
    const o = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(termo+' '+(l.autor||''))}&limit=5&fields=cover_i`).then(r=>r.json());
    const d = (o.docs||[]).find(d=>d.cover_i);
    if (d) url = `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`;
  } catch(e){}
  if (!url) try {
    const q = 'intitle:' + encodeURIComponent(termo) + (l.autor ? '+inauthor:' + encodeURIComponent(l.autor) : '');
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=1&fields=items(volumeInfo/imageLinks)`);
    if (r.status === 429) return ''; // cota do Google esgotada hoje: não grava no cache, tenta outro dia
    const im = (await r.json()).items?.[0]?.volumeInfo?.imageLinks;
    if (im) url = (im.thumbnail||im.smallThumbnail).replace('http:','https:').replace('&edge=curl','');
  } catch(e){ return ''; }
  capas[k] = url; salvarCache(); return url;
}
function processarFila(){
  while (ativos < 4 && fila.length) {
    const el = fila.shift(); if (!el.isConnected) continue; ativos++;
    buscarCapa(el._l).then(url => {
      if (url && el.isConnected) { const img = new Image(); img.className='capa'; img.loading='lazy'; img.alt='';
        img.onload = () => el.firstChild.replaceWith(img); img.src = url; }
    }).finally(()=>{ ativos--; processarFila(); });
  }
}
const observador = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ observador.unobserve(e.target); fila.push(e.target); processarFila(); } }), {rootMargin:'300px'});

function linkTelegram(l){ return CANAL ? `https://t.me/c/${CANAL}/${l.id}` : '#'; }
async function detalhe(l) {
  const url = await buscarCapa(l);
  $('#det').innerHTML = `<div class="box">${url?`<img src="${url}" alt="">`:capaGerada(l)}<div>
    <h2>${esc(l.titulo)}</h2>${l.autor?`<p>${esc(l.autor)}</p>`:''}
    <p>${[l.tipo, l.tamanho, l.data].filter(Boolean).map(esc).join(' · ')}</p>
    ${l.arquivo?`<p style="font-size:.8rem;word-break:break-all">${esc(l.arquivo)}</p>`:''}
    <a class="btn" href="${linkTelegram(l)}" target="_blank" rel="noopener">Abrir no Telegram</a><br>
    <button class="fechar">Fechar</button></div></div>`;
  $('#det').classList.remove('hidden');
  $('#det .fechar').onclick = () => $('#det').classList.add('hidden');
}
$('#det').onclick = e => { if (e.target.id==='det') $('#det').classList.add('hidden'); };

let t; $('#busca').oninput = () => { clearTimeout(t); t = setTimeout(filtrar, 200); };
$('#tipo').onchange = filtrar; $('#ordem').onchange = filtrar;
$('#letras').onclick = e => { const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#letras button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); letra = b.dataset.l; filtrar(); };
$('#mais').onclick = mostrarMais;
$('#sair').onclick = () => { sessionStorage.clear(); localStorage.removeItem('nb-sessao'); location.reload(); };

$('#f').onsubmit = async e => {
  e.preventDefault(); $('#erro').textContent = 'Abrindo…';
  try {
    const r = await abrir($('#u').value, $('#s').value);
    localStorage.setItem('nb-sessao', JSON.stringify({nome:r.nome, master:r.master}));
    $('#erro').textContent = ''; iniciar(r.nome, r.dados);
  } catch(err) { $('#erro').textContent = err.message || 'Erro ao abrir.'; }
};
(async () => { try { const s = JSON.parse(localStorage.getItem('nb-sessao')||'null');
  if (s) iniciar(s.nome, await abrirComMaster(s.master)); } catch(e){ localStorage.removeItem('nb-sessao'); } })();
</script>
</body>
</html>
